name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon 2>&1 | tee build.log
      - name: Show errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "error:|symbol:|What went wrong|Could not|FAILED" build.log | sed 's#.*/platinumvault/##' | sort -u | head -80 | while IFS= read -r line; do echo "::error::${line}"; done
          JAR=$(find ~/.gradle -name "*.jar" -path "*better-motors*" | head -1)
          echo "::error::JAR=${JAR}"
          unzip -l "$JAR" | grep -i -E "alternator|CommonConfig|CBMBlocks|StringFormatting" | awk '{print $4}' | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: platinum-vault
          path: build/libs/*.jar
